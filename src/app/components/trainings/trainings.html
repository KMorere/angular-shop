<div class="container">
    <div id="prices">
        Price
        <input type="number" id="priceMin" autocomplete="off" [value]="min" (keyup)="filterPriceUnder()" placeholder="Min">
        -
        <input type="number" id="priceMax" autocomplete="off" [value]="max" (keyup)="filterPriceAbove()" placeholder="Max">
    </div>

    @if (listTrainings) {
        <ng-container>
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>DESCRIPTION</th>
                        <th>PRICE</th>
                        <th>QUANTITY</th>
                    </tr>
                </thead>
                <tbody id="course-grid">
                    @for(course of listTrainings; track course) {
                        <tr>
                            <td>{{course.id}}</td>
                            <td>{{course.name}}</td>
                            <td>{{course.description}}</td>
                            <td>{{course.price}}</td>
                            <td><input type="number" name="quantity" style="width: 60px" min="0" [value]="course.quantity" (input)="updateQuantity(course, $event.target.value)"></td>
                            <td>
                                @if(+course.quantity > 0) {
                                    <button type="button" class="btn btn-primary" (click)="onAddToCart(course)">Add to cart</button>
                                }
                                @else {
                                    <a class="btn btn-secondary disabled">Add to cart</a>
                                }
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </ng-container>
    }
</div>
