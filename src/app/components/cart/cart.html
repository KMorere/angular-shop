<div class="container">
    @if (cart) {
        <ng-container>
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>QUANTITY</th>
                        <th>PRICE</th>
                    </tr>
                </thead>
                <tbody>
                    @for(course of cart; track course) {
                        <tr>
                            <td>{{course.id}}</td>
                            <td>{{course.name}}</td>
                            <td>{{course.quantity}}</td>
                            <td>{{+course.price * +course.quantity | currency: 'EUR':'symbol':'1.2-2':'fr-FR'}}</td>
                            <td>
                                <button type="button" class="btn btn-danger" (click)="deleteCourse(course)">Delete</button>
                            </td>
                        </tr>
                    }
                    <tr>
                        <td class="fw-bold">TOTAL</td>
                        <td [innerText]="getTotal()"></td>
                    </tr>
                </tbody>
            </table>

            @if (cart.size > 0) {
                @if (this.auth.isLoggedIn()) {
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#order-modal">
                        Start order
                    </button>
                    <app-order></app-order>
                } @else {
                    <button type="button" class="btn btn-secondary" disabled>
                        Must be logged-in
                    </button>
                }
            }
        </ng-container>
    }
</div>
