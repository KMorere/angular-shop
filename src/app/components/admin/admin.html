<div class="container">
    <ng-container>
        <button class="btn btn-success" style="margin-top: 10px;" (click)="setAction('create')" data-bs-toggle="modal" data-bs-target="#course-modal">+ Add Course</button>

        <table class="table table-striped table-bordered" style="margin-top: 10px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>DESCRIPTION</th>
                    <th>PRICE</th>
                </tr>
            </thead>
            <tbody id="admin-grid">
                @for(course of listTrainings; track course) {
                    <tr>
                        <td>{{course.id}}</td>
                        <td>{{course.name}}</td>
                        <td>{{course.description}}</td>
                        <td>{{course.price | currency: 'EUR':'symbol':'1.2-2':'fr-FR'}}</td>
                        <td class="buttons text-center"><button type="button" class="btn btn-primary"
                             (click)="updateCourse(course)" data-bs-toggle="modal" data-bs-target="#course-modal">
                            <img src="edit.png" width="20px" height="20px">
                            Update
                        </button></td>
                        <td class="buttons text-center"><button type="button" class="btn btn-danger" (click)="deletCourse(course)">
                            X Delete
                        </button></td>
                    </tr>
                }
            </tbody>
        </table>
    </ng-container>
</div>

<div class="modal fade" id="course-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <!-- Order form -->
            <form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Create a new course</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <label for="modal-name" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="modal-name" formControlName="name" autocomplete="off" placeholder="name...">
                    
                    <label for="modal-description" class="form-label">Description:</label>
                    <input type="text" autocomplete="off" class="form-control" id="modal-description" formControlName="description" autocomplete="off" placeholder="description...">
                    
                    <label for="modal-price" class="form-label">Price:</label>
                    <input type="number" min="0" autocomplete="off" class="form-control" id="modal-price" formControlName="price" autocomplete="off" placeholder="1000">
                </div>
                
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid" data-bs-dismiss="modal">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
