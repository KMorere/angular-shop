<nav class="navbar navbar-expand-sm bg-body-tertiary bg-light">
	<div class="container-fluid">
		<a class="navbar-brand" href="#">TRAININGS</a>
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link" routerLink="/trainings">Courses</a>
				</li>
				<li class="nav-item">
					<button class="nav-link" data-bs-toggle="offcanvas" data-bs-target="#cart-offcanvas" 
					matBadge="{{cart.cartContent?.length}}" matBadgeOverlap="true">Cart</button>
				</li>

				@if (this.auth.isAdmin()) {
					<li class="nav-item">
						<a class="nav-link" routerLink="/admin">Admin</a>
					</li>
				}
			</ul>

		<div class="collapse navbar-collapse d-flex justify-content-end" id="navbarContent">
			<div class="d-inline-flex align-items-center mx-3 me-4">
                <input type="checkbox" class="checkbox" id="chk"
                [checked]="theme.theme() === 'dark'" (change)="toggleTheme()"/>
                <label class="label-switch" for="chk">
                    @if (theme.theme() === "light") {
                        <i class="bi bi-sun-fill"></i>
                    } @else {
                        <i class="bi bi-moon-stars-fill"></i>
                    }
                    <div class="ball"></div>
                </label>
            </div>

			<form class="d-flex nav-item dropdown" role="search" [formGroup]="searchForm" (ngSubmit)="onSearchCourse()">
				<input type="search" class="form-control me-2 dropdown-toggle" formControlName="text"
				 data-bs-toggle="dropdown" placeholder="Search for course..." aria-label="Search"/>
				<button type="submit" class="btn btn-outline-secondary">Search</button>
				
				<ul class="dropdown-menu" id="coursesSearch">
					@for(course of coursesArray; track course) {
						<li>
							<button class="dropdown-item" href="#" (click)="onAddToCart(course)">{{course.name}}</button>
						</li>
					}
				</ul>
			</form>

			<div class="vr" style="margin-left: 15px;"></div>

			@if (!auth.isLoggedIn()) {
				<button type="button" class="btn btn-primary" style="margin-left: 15px; margin-right: 10px;" 
				data-bs-toggle="modal" data-bs-target="#register-modal">Log-in</button>
				<app-register></app-register>
			} @else {
				<div class="dropdown" style="margin-left: 15px; margin-right: 10px;">
					<button type="button" class="btn btn-outline-primary d-flex justify-content-center align-content-center align-items-center"
					 style="padding-top: 0; padding-bottom: 0; padding-inline: 4px;" data-bs-toggle="dropdown">
						<i class="bi bi-person-circle" style="font-size: 25px; margin-right: 4px;"></i>
						Account
					</button>
					<ul class="dropdown-menu dropdown-menu-end">
						<li><a class="dropdown-item">Action 1</a></li>
						<li><a class="dropdown-item">Action 2</a></li>
						<li><a class="dropdown-item">Action 3</a></li>
						<li><hr class="dropdown-divider"></li>
						<li><a type="button" class="dropdown-item" (click)="auth.logOff()">
							<i class="bi bi-box-arrow-left"></i>
							Log-off</a></li>
					</ul>
				</div>
			}
		</div>
	</div>
</nav>

<app-cart-navbar></app-cart-navbar>
